<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E18">
<title>Luis CMD</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0B0E18;--surface:rgba(20,28,50,0.92);--surfL:rgba(30,40,65,0.95);
--bdr:rgba(80,120,200,0.2);--bdrA:rgba(0,255,208,0.4);
--acc:#00FFD0;--pink:#FF3B6B;--purp:#B388FF;--yel:#FFDA2A;
--t1:#E8ECF4;--t2:#8A95B0;--t3:#556080;
--font:'VT323',monospace;--fontP:'Press Start 2P',monospace;
--safe-b:env(safe-area-inset-bottom,0px)
}
body{background:var(--bg);color:var(--t1);font-family:var(--font);min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:var(--font)}
.app{display:flex;min-height:100vh;min-height:100dvh}

.sidebar{width:200px;background:var(--surface);border-right:1.5px solid var(--bdr);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.sb-brand{padding:22px 18px 20px;border-bottom:1px solid var(--bdr)}
.sb-brand h1{font-family:var(--fontP);font-size:12px;color:var(--acc);letter-spacing:2px;font-weight:400}
.sb-brand p{font-size:15px;color:var(--t3);margin-top:4px}
.sb-nav{padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.sb-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;background:transparent;border:1px solid transparent;border-radius:8px;width:100%;text-align:left;font-size:19px;color:var(--t2);position:relative}
.sb-btn.on{background:rgba(0,255,208,0.1);border-color:var(--bdrA);color:var(--acc)}
.sb-foot{padding:14px 18px;border-top:1px solid var(--bdr);font-size:14px;color:var(--t3)}

.btab{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(11,14,24,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1.5px solid var(--bdr);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + var(--safe-b))}
.btab button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;padding:4px 18px;min-width:60px;font-size:14px;color:var(--t3);position:relative}
.btab button.on{color:var(--acc)}

.main{flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.hdr{padding:16px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--bdr);background:var(--surface);position:sticky;top:0;z-index:50}
.hdr h2{font-family:var(--fontP);font-size:13px;color:var(--acc);letter-spacing:2px;font-weight:400}
.hdr-date{font-size:16px;color:var(--t2);margin-top:3px}
.hdr-pills{display:flex;gap:8px;align-items:center}
.pill{background:var(--surface);border:1.5px solid var(--bdr);border-radius:20px;padding:5px 14px;display:flex;align-items:center;gap:6px;font-size:17px}
.pill .dot{width:7px;height:7px;border-radius:50%}

.content{padding:18px 0;flex:1}

.icon{display:inline-flex;align-items:center;justify-content:center;border:2px solid #000;border-radius:5px;font-family:var(--fontP);flex-shrink:0;box-shadow:2px 2px 0 #000}
.badge{position:absolute;top:-5px;right:-10px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);display:flex;align-items:center;justify-content:center;font-family:var(--fontP);font-size:7px;color:#fff;padding:0 4px;border:2px solid var(--bg)}

.metrics{display:grid;gap:10px;padding:0 22px}
.mc{background:var(--surface);border:1.5px solid var(--bdr);border-radius:12px;padding:16px 18px}
.mc-label{font-size:15px;color:var(--t2);margin-bottom:6px}
.mc-val{font-family:var(--fontP);font-size:18px;line-height:1.3}
.mc-sub{font-size:15px;color:var(--t2);margin-top:6px}

.card{background:var(--surfL);border:1.5px solid var(--bdr);border-radius:12px;overflow:hidden}
.card.hl{border-color:var(--bdrA)}
.slabel{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
.slabel span:first-child{font-family:var(--fontP);font-size:9px;color:var(--t3);letter-spacing:2px}
.slabel span:last-child{font-size:15px;color:var(--t3)}

.acard{background:var(--surfL);border:2px solid var(--bdr);border-radius:10px;padding:16px 18px;box-shadow:0 2px 12px rgba(0,0,0,0.3);display:flex;flex-direction:column;gap:10px}
.acard-head{display:flex;justify-content:space-between;align-items:center}
.acard-sender{font-family:var(--fontP);font-size:9px;color:var(--t1);line-height:1.6}
.acard-tag{font-size:13px;background:var(--pink);color:#fff;padding:3px 10px;border-radius:4px;border:1px solid #000}
.acard-body{font-size:18px;color:var(--t2);line-height:1.4}
.acard-btns{display:flex;gap:8px}
.acard-btns button{border:2px solid #000;border-radius:5px;padding:7px 16px;font-size:16px;box-shadow:2px 2px 0 #000}

.erow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bdr);cursor:pointer}
.erow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.erow-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.erow-from{font-size:19px;color:var(--t1)}
.erow-time{font-size:14px;color:var(--t3);flex-shrink:0}
.erow-action{font-size:16px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.frow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bdr);cursor:pointer}
.frow-title{font-size:19px;color:var(--t1)}
.frow-owner{font-size:15px;color:var(--t2)}
.frow-time{font-size:14px;color:var(--t3)}

.prow{display:flex;gap:14px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--bdr)}
.prow-num{width:30px;height:30px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-family:var(--fontP);font-size:10px;flex-shrink:0}
.prow-title{font-size:20px;color:var(--t1);margin-bottom:4px}
.prow-desc{font-size:16px;color:var(--t2)}
.prow button{border:2px solid #000;border-radius:5px;padding:6px 12px;font-size:15px;box-shadow:2px 2px 0 #000;flex-shrink:0}

.action-grid{display:grid;gap:10px}
.focus-btns{display:grid;gap:10px}
.focus-btns button{border:2px solid #000;border-radius:6px;padding:10px 18px;font-size:17px;box-shadow:3px 3px 0 #000}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 20px;text-align:center}
.loading h3{font-family:var(--fontP);font-size:11px;color:var(--acc);letter-spacing:2px}
.loading p{font-size:18px;color:var(--t2)}
.spinner{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:479px){
.sidebar{display:none}
.hdr{padding:14px}
.hdr h2{font-size:11px}
.metrics{padding:0 14px}
.card-wrap{padding:0 14px}
.action-wrap{padding:0 14px}
.focus-wrap{padding:0 14px}
.main{padding-bottom:calc(80px + var(--safe-b))}
}
@media(min-width:480px){
.btab{display:none}
.metrics{grid-template-columns:repeat(4,1fr)}
.action-grid{grid-template-columns:1fr 1fr}
.focus-btns{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:479px){
.metrics{grid-template-columns:1fr 1fr}
.action-grid{grid-template-columns:1fr}
.focus-btns{grid-template-columns:1fr}
}
@media(min-width:480px) and (max-width:1023px){
.sidebar{width:180px}
}
</style>

</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;

const TABS = [
{id:"home",label:"Home",icon:"H"},
{id:"inbox",label:"Inbox",icon:"@"},
{id:"files",label:"Files",icon:"F"},
{id:"focus",label:"Focus",icon:"!"},
];

const useDevice = () => {
const [d,setD] = useState(window.innerWidth<480?"phone":window.innerWidth<1024?"tablet":"desktop");
useEffect(()=>{const c=()=>setD(window.innerWidth<480?"phone":window.innerWidth<1024?"tablet":"desktop");window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c)},[]);
return d;
};

const Icon = ({letter,color="#00FFD0",size=28,glow}) => (
  <div className="icon" style={{width:size,height:size,background:color,fontSize:Math.round(size*0.3),color:"#000",boxShadow:glow?`0 0 10px ${color}44, 2px 2px 0 #000`:"2px 2px 0 #000"}}>{letter}</div>
);

const BadgeC = ({count}) => count>0 ? <div className="badge">{count}</div> : null;

const SidebarNav = ({active,onNav,dateStr}) => (
  <div className="sidebar">
    <div className="sb-brand"><h1>LUIS CMD</h1><p>v1.0</p></div>
    <div className="sb-nav">
      {TABS.map(t=>(
        <button key={t.id} className={`sb-btn${active===t.id?" on":""}`} onClick={()=>onNav(t.id)}>
          <Icon letter={t.icon} color={active===t.id?"#00FFD0":"#556080"} size={22}/>
          <span>{t.label}</span>
          {t.id==="inbox"&&<BadgeC count={2}/>}
        </button>
      ))}
    </div>
    <div className="sb-foot">{dateStr}</div>
  </div>
);

const BottomTabBar = ({active,onNav}) => (
  <div className="btab">
    {TABS.map(t=>(
      <button key={t.id} className={active===t.id?"on":""} onClick={()=>onNav(t.id)}>
        <Icon letter={t.icon} color={active===t.id?"#00FFD0":"#556080"} size={24} glow={active===t.id}/>
        <span>{t.label}</span>
        {t.id==="inbox"&&<BadgeC count={2}/>}
      </button>
    ))}
  </div>
);

const Metric = ({label,value,sub,color="#00FFD0"}) => (
  <div className="mc">
    <div className="mc-label">{label}</div>
    <div className="mc-val" style={{color}}>{value}</div>
    {sub&&<div className="mc-sub">{sub}</div>}
  </div>
);

const ActionCard = ({item,onDone}) => (
  <div className="acard">
    <div className="acard-head">
      <span className="acard-sender">{item.sender}</span>
      <span className="acard-tag">ACTION</span>
    </div>
    <p className="acard-body">{item.action}</p>
    <div className="acard-btns">
      <button onClick={onDone} style={{background:"#00FFD0",color:"#000"}}>Done</button>
      <button style={{background:"#B388FF",color:"#000"}}>Draft reply</button>
    </div>
  </div>
);

const EmailRow = ({item,type}) => {
const dc = {urgent:"#FF3B6B",starred:"#FFDA2A",fyi:"#00FFD0"};
return (
<div className="erow">
<div className="dot" style={{background:dc[type],boxShadow:`0 0 8px ${dc[type]}`}}/>
<div style={{flex:1,minWidth:0}}>
<div className="erow-head">
<span className="erow-from">{item.from}</span>
<span className="erow-time">{item.time}</span>
</div>
<div className="erow-action">{item.action}</div>
</div>
</div>
);
};

const FileRow = ({item}) => (
  <div className="frow">
    <Icon letter={item.type==="PDF"?"P":"D"} color={item.type==="PDF"?"#FF3B6B":"#FFDA2A"} size={30}/>
    <div style={{flex:1,minWidth:0}}>
      <div className="frow-title">{item.title}</div>
      <div className="frow-owner">{item.owner}{item.event?` — ${item.event}`:""}</div>
    </div>
    <span className="frow-time">{item.time}</span>
  </div>
);

const PriorityRow = ({item}) => {
const c = ["#FF3B6B","#B388FF","#FFDA2A"];
return (
<div className="prow">
<div className="prow-num" style={{background:c[item.rank-1],color:item.rank===3?"#000":"#fff",boxShadow:`0 0 10px ${c[item.rank-1]}44`}}>{item.rank}</div>
<div style={{flex:1}}>
<div className="prow-title">{item.title}</div>
<div className="prow-desc">{item.desc}</div>
</div>
<button className="prow" style={{background:c[item.rank-1],color:item.rank===3?"#000":"#fff"}}>Go</button>
</div>
);
};

const SLabel = ({children,count}) => (
  <div className="slabel"><span>{children}</span>{count!=null&&<span>{count}</span>}</div>
);

const DEFAULT_DATA = {
date: new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}),
time: new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true}),
weather:{temp:"--",conditions:"Loading",rain:"--",high:"--"},
calendar:[],
email:{urgent:[],starred:[],fyi:[],skipped:0},
drive:[],
priorities:[],
loaded:false,
};

function App(){
const device = useDevice();
const isPhone = device==="phone";
const [tab,setTab] = useState("home");
const [done,setDone] = useState([]);
const [data,setData] = useState(DEFAULT_DATA);
const [loading,setLoading] = useState(true);
const [error,setError] = useState(null);

const fetchBriefing = useCallback(async()=>{
setLoading(true);
setError(null);
try {
const resp = await fetch("https://luis-cmd-proxy.lespinosa.workers.dev",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
model:"claude-sonnet-4-20250514",
max_tokens:4000,
system:`You are a daily briefing data compiler. Return ONLY valid JSON, no markdown, no preamble. Today is ${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}. Timezone: America/New_York. User: Luis Espinosa, lespinosa@frostflorida.com, Coral Springs FL. Compile data from all available MCP tools into this exact JSON structure: {"weather":{"temp":number,"conditions":"string","rain":number,"high":number},"calendar":[{"time":"HH:MM","title":"string","location":"string"}],"email":{"urgent":[{"id":number,"sender":"string","from":"string","subject":"string","action":"string","time":"string"}],"starred":[same shape],"fyi":[same shape],"skipped":number},"drive":[{"title":"string","owner":"string","type":"PDF|Folder","event":"string","time":"string"}],"priorities":[{"rank":1-3,"title":"string","desc":"string"}]} Steps: 1) Search web for Coral Springs FL weather. 2) List today's calendar events. 3) Search Gmail: is:unread newer_than:2d (skip newsletters/promotions). Categorize into urgent (someone waiting for reply from known contacts: @frostflorida.com, @amplifiedeventstrategy.com, @clproductions.net, @apple.com), starred, fyi. 4) List 6 recent Drive files. 5) Determine top 3 priorities. Return ONLY the JSON.`,
messages:[{role:"user",content:"Compile my daily briefing now."}],
mcp_servers:[
{type:"url",url:"https://calendarmcp.googleapis.com/mcp/v1",name:"gcal"},
{type:"url",url:"https://gmailmcp.googleapis.com/mcp/v1",name:"gmail"},
{type:"url",url:"https://drivemcp.googleapis.com/mcp/v1",name:"gdrive"},
],
tools:[{type:"web_search_20250305",name:"web_search"}],
})
});
const result = await resp.json();
const textBlocks = (result.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
const cleaned = textBlocks.replace(/```json|```/g,"").trim();
const parsed = JSON.parse(cleaned);
setData({
...DEFAULT_DATA,
...parsed,
date: new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}),
time: new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true}),
loaded:true,
});
} catch(err) {
console.error("Briefing fetch error:",err);
setError("Could not load live data. Showing demo data.");
setData({
date: new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}),
time: new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true}),
weather:{temp:82,conditions:"Clear",rain:40,high:83},
calendar:[],
email:{
urgent:[
{id:1,sender:"Apple Boca Raton",from:"Eric Friedman",subject:"Re: Adding admin user",action:"Reply with admin user details",time:"Apr 24"},
{id:2,sender:"AliExpress",from:"Transaction",subject:"Order awaiting confirmation",action:"Confirm or dispute before auto-completion",time:"Apr 25"},
],
starred:[{id:3,sender:"Amplified",from:"Tricia",subject:"Upbit keynote",action:"speech_final.key shared",time:"Apr 24"}],
fyi:[
{id:4,sender:"Amplified",from:"Elaine",subject:"Speaker Details",action:"Resolved",time:"Apr 25"},
{id:5,sender:"Google",from:"Security",subject:"New sign-in",action:"Verify if this was you",time:"Apr 25"},
],
skipped:6,
},
drive:[
{title:"Birch Wedding Proposal",owner:"David Ramos",type:"PDF",event:"5/28 Hilton WPB",time:"Yesterday"},
{title:"AF Carnival Proposal v2",owner:"David Ramos",type:"PDF",event:"5/16 Atlantic Fields",time:"Yesterday"},
{title:"JBT Rental",owner:"David Ramos",type:"Folder",event:"",time:"Yesterday"},
],
priorities:[
{rank:1,title:"Reply to Apple Boca Raton",desc:"Eric needs admin user details"},
{rank:2,title:"Confirm AliExpress order",desc:"Auto-completes soon"},
{rank:3,title:"Review David's proposals",desc:"Deposit deadline 5/9"},
],
loaded:true,
});
}
setLoading(false);
},[]);

useEffect(()=>{fetchBriefing();},[]);

const urgentLeft = (data.email?.urgent||[]).filter(e=>!done.includes(e.id));

const HomeView = () => (
<div style={{display:"flex",flexDirection:"column",gap:20}}>
<div className="metrics">
<Metric label="Weather" value={`${data.weather?.temp||"--"}°F`} sub={`${data.weather?.conditions||""} — Rain ${data.weather?.rain||"--"}%`} color="#FFDA2A"/>
<Metric label="Calendar" value={data.calendar?.length?"Events":"Clear"} sub={data.calendar?.length?`${data.calendar.length} today`:"No events today"} color="#00FFD0"/>
<Metric label="Inbox" value={`${urgentLeft.length}`} sub="actions needed" color="#FF3B6B"/>
<Metric label="Files" value={`${data.drive?.length||0}`} sub="updated (24h)" color="#B388FF"/>
</div>
<div className="action-wrap" style={{padding:isPhone?"0 14px":"0 22px"}}>
<SLabel count={`${urgentLeft.length} pending`}>ACTION ITEMS</SLabel>
<div className="action-grid" style={{marginTop:4}}>
{urgentLeft.map(item=><ActionCard key={item.id} item={item} onDone={()=>setDone(p=>[...p,item.id])}/>)}
{urgentLeft.length===0&&(
<div className="card" style={{padding:28,textAlign:"center",gridColumn:"1/-1"}}>
<div style={{fontFamily:"var(--fontP)",fontSize:11,color:"var(--acc)"}}>ALL CLEAR</div>
<div style={{fontSize:18,color:"var(--t2)",marginTop:8}}>No actions remaining</div>
</div>
)}
</div>
</div>
<div className="card-wrap" style={{padding:isPhone?"0 14px":"0 22px"}}>
<div className="card hl">
<SLabel>TOP 3 PRIORITIES</SLabel>
{(data.priorities||[]).map(p=><PriorityRow key={p.rank} item={p}/>)}
</div>
</div>
</div>
);

const InboxView = () => (
<div style={{display:"flex",flexDirection:"column",gap:14,padding:isPhone?"0 14px":"0 22px"}}>
<div className="card"><SLabel count={(data.email?.urgent||[]).length}>REQUIRES ACTION</SLabel>{(data.email?.urgent||[]).map(e=><EmailRow key={e.id} item={e} type="urgent"/>)}</div>
<div className="card"><SLabel count={(data.email?.starred||[]).length}>STARRED</SLabel>{(data.email?.starred||[]).map(e=><EmailRow key={e.id} item={e} type="starred"/>)}</div>
<div className="card"><SLabel count={(data.email?.fyi||[]).length}>FYI</SLabel>{(data.email?.fyi||[]).map(e=><EmailRow key={e.id} item={e} type="fyi"/>)}</div>
<div style={{textAlign:"center",padding:"8px 0",fontSize:15,color:"var(--t3)"}}>{data.email?.skipped||0} newsletters filtered</div>
</div>
);

const FilesView = () => (
<div style={{padding:isPhone?"0 14px":"0 22px"}}>
<div className="card"><SLabel count={(data.drive||[]).length}>RECENT FILES</SLabel>{(data.drive||[]).map((f,i)=><FileRow key={i} item={f}/>)}</div>
</div>
);

const FocusView = () => (
<div style={{display:"flex",flexDirection:"column",gap:16}}>
<div className="card-wrap" style={{padding:isPhone?"0 14px":"0 22px"}}>
<div className="card hl"><SLabel>TODAY'S PRIORITIES</SLabel>{(data.priorities||[]).map(p=><PriorityRow key={p.rank} item={p}/>)}</div>
</div>
<div className="focus-wrap" style={{padding:isPhone?"0 14px":"0 22px"}}>
<div className="focus-btns">
<button onClick={fetchBriefing} style={{background:"#00FFD0",color:"#000"}}>Refresh briefing</button>
<button style={{background:"#B388FF",color:"#000"}}>Draft reply to Apple</button>
<button style={{background:"#FFDA2A",color:"#000"}}>Review proposals</button>
</div>
</div>
</div>
);

const views = {home:<HomeView/>,inbox:<InboxView/>,files:<FilesView/>,focus:<FocusView/>};

return (
<div className="app">
{!isPhone && <SidebarNav active={tab} onNav={setTab} dateStr={data.date}/>}
<div className="main">
<div className="hdr">
<div>
<h2>{isPhone?"LUIS CMD":TABS.find(t=>t.id===tab)?.label.toUpperCase()}</h2>
<div className="hdr-date">{data.date}</div>
</div>
<div className="hdr-pills">
<div className="pill"><div className="dot" style={{background:"#FFDA2A",boxShadow:"0 0 6px #FFDA2A"}}/><span style={{color:"var(--t1)"}}>{data.weather?.temp||"--"}°F</span></div>
<div className="pill"><span style={{color:"var(--t2)"}}>{data.time}</span></div>
</div>
</div>
<div className="content">
{loading ? (
<div className="loading">
<div className="spinner"/>
<h3>COMPILING BRIEFING</h3>
<p>Pulling calendar, email, drive, weather…</p>
</div>
) : views[tab]}
{error && <div style={{textAlign:"center",padding:"8px 14px",fontSize:14,color:"#FFDA2A"}}>{error}</div>}
</div>
</div>
{isPhone && <BottomTabBar active={tab} onNav={setTab}/>}
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
